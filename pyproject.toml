[project]
name = "ft"
version = "0.1.0"
description = ""
authors = [
    {name = "cpadlab",email = "cpadlab@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pymupdf (>=2.1,<3.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "openai (>=3.49.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "datasets (>=5.2.0,<6.0.0)",
    "transformers (>=5.22.2,<6.0.0)",
    "huggingface-hub (>=2.4.0,<3.0.0)",
    "bitsandbytes (>=0.50.2,<0.51.0)",
    "peft (>=0.21.2,<0.22.0)",
    "accelerate (>=1.15.0,<2.0.0)",
    "torch (>=2.15.0,<3.0.0)",
    "trl (>=1.17.1,<2.0.0)"
]

[tool.poetry]
packages = [{include = "ft", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
